<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magyar Névelő és Tartalom Ellenőrző</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f8fafc;
            font-family: 'Inter', sans-serif;
        }
        .container-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        .code-area {
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.875rem;
            resize: vertical;
            min-height: 250px;
        }
        .error-item {
            border-left: 4px solid #ef4444;
        }
        .warning-item {
            border-left: 4px solid #f59e0b;
        }
    </style>
</head>
<body class="p-4 md:p-12">
    <div class="max-w-5xl mx-auto bg-white rounded-2xl container-shadow overflow-hidden">
        <!-- Header -->
        <div class="p-8 bg-indigo-800 text-white">
            <h1 class="text-3xl font-bold">Magyar Névelő & Tartalom Ellenőrző</h1>
            <p class="text-indigo-200 mt-2 text-lg">Névelőhelyesség, Alza linkek és Zarovka szűrés.</p>
        </div>

        <div class="p-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Bal oldal: Input -->
            <div class="lg:col-span-2 space-y-6">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Forráskód vagy szöveg</label>
                    <textarea id="textInput" class="w-full input-field border border-gray-300 rounded-xl p-4 code-area focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none" placeholder="Másold be a tartalmat ide..."></textarea>
                </div>
                
                <button onclick="checkAll()" class="w-full py-4 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 transition shadow-lg flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    Ellenőrzés indítása
                </button>
            </div>

            <!-- Jobb oldal: Eredmények -->
            <div class="bg-slate-50 rounded-xl p-6 border border-slate-200 h-fit">
                <h2 class="text-xl font-bold text-slate-800 mb-6 border-b pb-2">Eredmények</h2>
                
                <div id="resultContainer" class="space-y-4">
                    <p class="text-gray-500 italic text-center py-8">Várakozás az elemzésre...</p>
                </div>

                <div id="stats" class="hidden mt-6 pt-6 border-t border-slate-200">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-sm text-gray-600">Névelők száma:</span>
                        <span id="totalArticles" class="font-bold">0</span>
                    </div>
                    <div class="flex justify-between items-center text-red-600">
                        <span class="text-sm">Névelő hiba:</span>
                        <span id="errorCount" class="font-bold">0</span>
                    </div>
                    <div id="contentIssuesRow" class="flex justify-between items-center text-amber-600 hidden">
                        <span class="text-sm">Tartalmi hiba:</span>
                        <span id="contentErrorCount" class="font-bold">0</span>
                    </div>
                </div>

                <button onclick="clearAll()" class="w-full mt-8 py-2 px-4 text-slate-500 hover:text-slate-800 transition text-sm font-medium">
                    Törlés
                </button>
            </div>
        </div>
    </div>

    <script>
        const vowels = "aeiouáéíóöőúüűAEIOUÁÉÍÓÖŐÚÜŰ";

        function isVowel(char) {
            return char ? vowels.indexOf(char) !== -1 : false;
        }

        function checkAll() {
            const input = document.getElementById('textInput').value;
            const resultContainer = document.getElementById('resultContainer');
            const stats = document.getElementById('stats');
            
            if (!input.trim()) {
                resultContainer.innerHTML = '<p class="text-gray-500 italic text-center py-8">Kérlek, írj be szöveget!</p>';
                stats.classList.add('hidden');
                return;
            }

            let resultsHTML = "";
            let errorCount = 0;
            let contentErrorCount = 0;

            // --- 1. TARTALOM ELLENŐRZÉS ---
            const contentIssues = [];
            
            // Alza.cz bárhol a kódban
            if (input.includes("alza.cz")) {
                contentIssues.push({ from: "alza.cz", to: "alza.hu" });
            }
            
            // Zarovka keresés: csak ha NEM követi a 100-as szám
            const zarovkaRegex = /zarovka(?!100)\b/gi;
            if (zarovkaRegex.test(input)) {
                contentIssues.push({ from: "zarovka", to: "zarovka100" });
            }

            if (contentIssues.length > 0) {
                contentErrorCount = contentIssues.length;
                resultsHTML += `<div class="mb-6 space-y-2">
                    <p class="text-xs font-bold text-amber-600 uppercase">Tartalmi figyelmeztetések:</p>
                    ${contentIssues.map(issue => `
                        <div class="warning-item bg-amber-50 p-3 rounded shadow-sm">
                            <div class="flex items-center gap-2">
                                <span class="text-amber-700 font-mono text-sm">${issue.from}</span>
                                <span class="text-gray-400">→</span>
                                <span class="text-green-700 font-bold">${issue.to}</span>
                            </div>
                        </div>
                    `).join('')}
                </div>`;
            }

            // --- 2. NÉVELŐ ELLENŐRZÉS (Alapértelmezett logika) ---
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = input;
            const scripts = tempDiv.querySelectorAll('script, style');
            scripts.forEach(s => s.remove());
            const cleanText = tempDiv.textContent || tempDiv.innerText || "";

            const regex = /\b(a|az)\b\s+([a-záéíóöőúüű0-9]+)/gi;
            let match;
            let totalArticles = 0;
            const articleErrors = [];

            while ((match = regex.exec(cleanText)) !== null) {
                totalArticles++;
                const article = match[1].toLowerCase();
                const nextWord = match[2];
                const firstChar = nextWord[0];
                
                const startsWithVowel = isVowel(firstChar);

                // Egyszerű szabály: az + magánhangzó, a + minden más
                const isCorrect = (article === 'az' && startsWithVowel) || (article === 'a' && !startsWithVowel);

                if (!isCorrect) {
                    errorCount++;
                    articleErrors.push({
                        found: match[0],
                        correct: (article === 'a' ? 'az' : 'a') + " " + nextWord
                    });
                }
            }

            if (articleErrors.length > 0) {
                resultsHTML += `<p class="text-xs font-bold text-red-600 uppercase mb-2">Névelő hibák:</p>` + 
                articleErrors.map(err => `
                    <div class="error-item bg-white p-3 rounded shadow-sm">
                        <div class="flex items-center gap-2 text-sm">
                            <span class="text-red-500 line-through">${err.found}</span>
                            <span class="text-gray-400">→</span>
                            <span class="text-green-600 font-bold">${err.correct}</span>
                        </div>
                    </div>
                `).join('');
            }

            if (resultsHTML === "") {
                resultsHTML = `
                    <div class="bg-green-50 p-6 rounded-lg text-center border border-green-100">
                        <p class="text-green-600 font-bold">Nincs hiba! ✅</p>
                    </div>`;
            }

            resultContainer.innerHTML = resultsHTML;
            document.getElementById('totalArticles').textContent = totalArticles;
            document.getElementById('errorCount').textContent = errorCount;
            document.getElementById('contentErrorCount').textContent = contentErrorCount;
            
            const contentRow = document.getElementById('contentIssuesRow');
            if (contentErrorCount > 0) contentRow.classList.remove('hidden');
            else contentRow.classList.add('hidden');
            
            stats.classList.remove('hidden');
        }

        function clearAll() {
            document.getElementById('textInput').value = '';
            document.getElementById('resultContainer').innerHTML = '<p class="text-gray-500 italic text-center py-8">Várakozás az elemzésre...</p>';
            document.getElementById('stats').classList.add('hidden');
        }
    </script>
</body>
</html>
